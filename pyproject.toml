[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoai-copilot"
version = "0.1.0"
description = "AI-assisted geoscience and petrophysics copilot"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ali Raza Shah"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "streamlit>=1.40,<2",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "pydantic-settings>=2.5,<3",
  "python-dotenv>=1.0,<2",
  "openpyxl>=3.1,<4",
  "httpx>=0.27,<1"
]

[project.optional-dependencies]
ml = ["xgboost>=2.1,<4"]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2"
]

[tool.setuptools.packages.find]
include = ["geoai_copilot*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
